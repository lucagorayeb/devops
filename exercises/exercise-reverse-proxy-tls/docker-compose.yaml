services:
  
  backend_app_1:
    image: hashicorp/http-echo
    command: ["-text", "Hello from Backend App 1"]
    networks:
      - backend
    
  
  backend_app_2:
    image: nginx:latest
    networks:
      - backend
  
  proxy:
    image: nginx:latest
    networks:
      - frontend
      - backend
    ports:
      - "8080:80"
      - "4343:443"
    volumes:
      - "./certs:/etc/nginx/certs:ro"
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"

networks:
  backend:
  frontend:
