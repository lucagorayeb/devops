user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
	# A documentação dessa parte de quantidade de conexões é a worker_connections 
	# que fica localizado em core functionality.
	worker_connections  1024;
}

http {
	# Atua como balanceador de carga 
	# O nome do servidor é o mesmo nome do container e a porta que ele expõe.
	# A documentação do upstream é a Module ngx_http_upstream_module.
	# Recebe as requisições http e distribui entre os containers. 
	# Essas requisições chegam através do proxy_pass para o upstream.
	upstream backend_pool {
		server backend_app_1:5678; 
		server backend_app_2:80;
	}

	# Redireciona http para https. 
	# A documentação para essa parte é a documentação do server, que é a Module ngx_http_rewrite_module.  
	server {
		listen 80;
		listen [::]:80;
		server_name backend_app_2 localhost;
		location / {
			return 301 https://$host$request_uri;
		}
	}

	# Recebe as requisições https e envia para o upstream.
	# Recebe os certificados de https.
	# A documentação para essa parte é a documentação do server, que é a Module ngx_http_server_module.  
	# A documentação Module ngx_http_ssl_module também serve.
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name backend_app_1;
		ssl_certificate 	/etc/nginx/certs/cert.pem;
		ssl_certificate_key 	/etc/nginx/certs/key.pem;
		ssl_protocols		TLSv1.2 TLSv1.3;
		ssl_ciphers		HIGH:!aNULL:!MD5;	
	
		location / {
			proxy_pass http://backend_pool;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
