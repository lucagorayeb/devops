user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {

	#	upstream backend.example.com {
	#	server backend1.example.com:443;
	#}
	
	server {
	
		listen 80;
		listen [::]:80;
	
		server_name 		www.proxy-reverso.com;
	
		#ssl_certificate 	/etc/nginx/certs/cert.pem;
		#ssl_certificate_key 	/etc/nginx/certs/key.pem;
	
		#ssl_protocols		TLSv1.2 TLSv1.3;
		#ssl_ciphers		HIGH:!aNULL:!MD5;	


		location / {
		
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		
			if ($scheme = http) {
				return 301 "Coneção http movida para https";
			}
			# proxy_pass http://localhost:80;
		}
	}


	server {
	
		listen 443 ssl;
		listen [::]:443 ssl;

		#server_name 		backend1.example.com;
		
		ssl_certificate 	/etc/nginx/certs/cert.pem;
		ssl_certificate_key 	/etc/nginx/certs/key.pem;
		
	
		ssl_protocols		TLSv1.2 TLSv1.3;
		ssl_ciphers		HIGH:!aNULL:!MD5;	
	

		location / {
		
			#proxy_ssl_certificate 			/etc/nginx/certs/cert.pem;
			#proxy_ssl_certificate_key 			/etc/nginx/certs/key.pem;
			#proxy_ssl_trusted_certificate 	/etc/nginx/certs/cert.pem;
			#proxy_ssl_verify 				on;
			#proxy_ssl_verify_depth				 2;
			
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		
			proxy_pass https://localhost:5678;
		}
	}

}

