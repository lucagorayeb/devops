upstream backend_app_1 {
    server backend_app_1:5678 max_conns=10 max_fails=3 fail_timeout=5s;
}

upstream backend_app_2 {
    server backend_app_2:80 max_conns=5 max_fails=3 fail_timeout=5s;
}

server {
    listen                  443 ssl;
    server_name             localhost;
    keepalive_timeout       70;
    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;

    location /backend_app_1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://localhost:5678;
}

    location /backend_app_2/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://localhost:80;   
    }
}



